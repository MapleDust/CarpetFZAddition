plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'me.fallenbreath.yamlang' version '1.5.0'
    id 'maven-publish'
}

version = project.mod_version + "-${minecraft_version}"
group = project.maven_group

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url = uri("https://masa.dy.fi/maven")
    }
    maven {
        url = uri("https://maven.parchmentmc.org")
        content { includeGroup("org.parchmentmc.data") }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "carpet_fz_addition" {
            sourceSet sourceSets.main
        }
    }

    runConfigs.configureEach {
        vmArgs("-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition")
        property("mixin.debug.export", "true")
    }
}

yamlang {
    targetSourceSets = [sourceSets.main]
    inputDir = 'assets/carpet_fz_addition/lang'
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:2025.12.20@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // carpet
    modImplementation "carpet:fabric-carpet:${project.minecraft_version}-${project.carpet_core_version}"

    // Lombok
    annotationProcessor(compileOnly "org.projectlombok:lombok:1.18.46")
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand([
                "id"     : project.mod_id,
                "version": version,
                "name"   : project.mod_name
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

tasks.named("runServer") {
    defaultCharacterEncoding = "UTF-8"

    doFirst {
        def eula = file("${project.projectDir}/run/eula.txt")
        if (!eula.exists()) {
            eula.parentFile.mkdirs()
            eula.bufferedWriter().use { it.write("eula=true\n") }
        }
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
